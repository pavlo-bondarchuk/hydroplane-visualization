<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fafaf8">
<title>Hydroplane Visualization — 3D Sketch Reveal</title>
<style>
:root{color-scheme:light}
*{box-sizing:border-box}
html,body{margin:0;background:#fafaf8;color:#20242a;font-family:Arial,Helvetica,sans-serif}
.story{height:400vh;position:relative}
.sticky{position:sticky;top:0;height:100svh;overflow:hidden;background:#fafaf8}
#aircraft{position:absolute;inset:0;width:100%;height:100%}
.label{position:absolute;z-index:2;left:clamp(20px,5vw,80px);top:clamp(20px,4vh,50px);font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:#535b60;pointer-events:none}
.title{position:absolute;z-index:2;left:clamp(20px,5vw,80px);bottom:clamp(30px,6vh,72px);pointer-events:none}
h1{margin:0 0 12px;font:italic 400 clamp(36px,6vw,88px)/.96 Georgia,serif;letter-spacing:-.045em}
.title p{margin:0;color:#737a7e;letter-spacing:.16em;text-transform:uppercase;font-size:11px}
.footer{padding:32px 5vw 72px;text-align:center;font-size:12px;color:#70777c}
a{color:inherit}
#error{display:none;position:absolute;inset:0;z-index:3;place-items:center;text-align:center;padding:25px;font-size:14px;color:#9a3131;background:#fafaf8e8}
@media(max-width:700px){h1{font-size:clamp(34px,10vw,54px)}.title{bottom:40px}}
</style>
</head>
<body>
<main>
<section class="story" data-sketch-track>
<div class="sticky">
<div id="aircraft"></div>
<div class="label">Hydroplane visualization / aviation study</div>
<div class="title"><h1>From sketch<br>to flight.</h1><p>Scroll to discover the aircraft</p></div>
<div id="error" role="alert"></div>
</div>
</section>
</main>
<footer class="footer">Demonstration model: <a href="https://polyfork.dev/asset/scrap-built-aeroplane-65ac95">Scrap-built aeroplane</a> by Polyfork. Original animation: <a href="https://github.com/dannystuart/sketch-to-3d">Sketch-to-3D</a>. This model is not a historic M-1 hydroplane reconstruction.</footer>
<script type="module">
try {
  const {mount} = await import('./sketch-to-3d/sketch-player.js');
  const player = await mount(document.getElementById('aircraft'), {
    model: 'scrap-built-aeroplane-65ac95.glb',
    poster: 'poster.jpg',
    alt: 'Scrap-built aeroplane, 3D sketch reveal',
    play: 'pin',
    end: 'hold',
    drag: false,
    studio: '#FAFAF8',
    pal: 'whitePaper',
    look: 'marker',
    az: 38,
    el: 24,
    turn: 0,
    fit: 1.25
  });
  if (!player) throw new Error('WebGL unavailable or model failed to load');
} catch(error) {
  const el=document.getElementById('error');
  el.style.display='grid';
  el.textContent='Не удалось загрузить 3D-анимацию: '+error.message;
}
</script>
</body>
</html>
