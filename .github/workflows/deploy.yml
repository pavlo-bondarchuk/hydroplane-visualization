name: Build and publish hydroplane visualization

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install model rendering dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Get original sketch-to-3d
        run: |
          git clone --depth 1 https://github.com/dannystuart/sketch-to-3d.git /tmp/sketch-to-3d
          cd /tmp/sketch-to-3d
          npm install
          npx playwright install --with-deps chromium
      - name: Download Polyfork GLB
        run: |
          mkdir -p models
          curl --fail --location --retry 3 --user-agent 'HydroplaneVisualization/1.0' \
            https://polyfork.dev/cdn/scrap-built-aeroplane-65ac95.glb \
            --output models/scrap-built-aeroplane-65ac95.glb
          test "$(head -c 4 models/scrap-built-aeroplane-65ac95.glb)" = glTF
      - name: Generate original Sketch-to-3D web player
        run: |
          node /tmp/sketch-to-3d/scripts/web.mjs \
            "$GITHUB_WORKSPACE/models/scrap-built-aeroplane-65ac95.glb" \
            --out "$GITHUB_WORKSPACE/dist" \
            --play pin \
            --end hold \
            --look marker \
            --pal whitePaper \
            --studio '#FAFAF8' \
            --size 1920x1080 \
            --az 38 \
            --el 24 \
            --turn 0 \
            --fit 1.25 \
            --base './sketch-to-3d/' \
            --alt 'Scrap-built aeroplane by Polyfork'
          test -s dist/sketch-to-3d/sketch-player.js
          test -s dist/sketch-to-3d/scrap-built-aeroplane-65ac95.glb
          cp index.html dist/index.html
          touch dist/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
